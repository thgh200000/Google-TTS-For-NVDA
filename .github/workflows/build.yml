# Packages the .nvda-addon, bundling the Node speech runtime that replaces the
# headless Chromium browser.
#
# The add-on drives Google's WASM TTS engine through a bundled node.exe (see
# googleTtsForNvda/synthDrivers/googleTtsForNvda/node_bridge.py), so the runtime has
# to be inside the shipped archive. fetch_node_runtime.py performs the download,
# extraction, executable discovery and placement; it is the same implementation
# build.bat and build.sh call, so CI and local builds cannot drift.
#
# The Node.js distribution archive is a full runtime layout (node.exe plus npm,
# corepack, headers and docs) nested in a versioned folder, e.g.
# node-v22.23.3-win-x64/node.exe. Only node.exe is packaged. That folder name
# tracks the version rather than being a documented stable contract, so the
# executable is located by a recursive search instead of a hardcoded path, and the
# archive is verified against the SHASUMS256.txt Node publishes beside each release.

name: Build add-on

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version to bundle (must exist on nodejs.org/dist)"
        required: false
        default: "v22.23.3"

permissions:
  # `write` is only needed by the tag-gated "Create release" step at the end.
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # fetch_node_runtime.py pins this by default; the dispatch input only overrides it.
  # Passing --version (rather than --url) keeps the SHASUMS256.txt verification on.
  NODE_VERSION: ${{ github.event.inputs.node_version || 'v22.23.3' }}
  ADDON_RUNTIME_DIR: googleTtsForNvda/synthDrivers/googleTtsForNvda/runtime

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show tool versions
        run: |
          python --version
          node --version

      # ---------------------------------------------------------------------
      # Download the pinned Node.js release archive from nodejs.org, verify it
      # against the SHASUMS256.txt published beside it, extract it, locate
      # node.exe by recursive search (the archive nests it in a versioned folder)
      # and copy it into the add-on payload where node_bridge.find_node() looks.
      # ---------------------------------------------------------------------
      - name: Download and bundle the Node.js speech runtime
        run: python fetch_node_runtime.py --version "$env:NODE_VERSION"

      - name: Verify node.exe was placed in the add-on payload
        run: |
          $exe = Join-Path "$env:ADDON_RUNTIME_DIR" "node.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ([System.Text.Encoding]::ASCII.GetString($bytes) -ne "MZ") { throw "$exe is not a PE executable" }
          $size = (Get-Item $exe).Length
          Write-Host "Found $exe ($size bytes)"
          if ($size -lt 20MB) { throw "$exe is suspiciously small ($size bytes)" }
          & $exe --version
          Get-Content (Join-Path "$env:ADDON_RUNTIME_DIR" "node_version.json")

      # ---------------------------------------------------------------------
      # Package. SKIP_NODE_RUNTIME=1 because the step above already bundled it.
      # ---------------------------------------------------------------------
      - name: Build the add-on package
        env:
          SKIP_NODE_RUNTIME: "1"
        run: ./build.bat

      - name: Verify the runtime is inside the .nvda-addon
        run: |
          $addon = Get-ChildItem dist -Filter *.nvda-addon | Select-Object -First 1
          if (-not $addon) { throw "No .nvda-addon was produced in dist/" }
          Write-Host "Package: $($addon.FullName) ($($addon.Length) bytes)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($addon.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @(
              "manifest.ini",
              "synthDrivers/googleTtsForNvda/runtime/node.exe",
              "synthDrivers/googleTtsForNvda/node_bridge.py",
              "synthDrivers/googleTtsForNvda/node_bootstrap.py",
              "synthDrivers/googleTtsForNvda/nodeRuntime/shim.js",
              "synthDrivers/googleTtsForNvda/nodeRuntime/worker.js",
              "synthDrivers/googleTtsForNvda/nodeRuntime/LICENSE-node.txt",
              "synthDrivers/googleTtsForNvda/web/bridgeHarness.js",
              "synthDrivers/googleTtsForNvda/WasmTtsEngine/20260917.1/bindings_main.wasm"
            )) {
              if ($names -notcontains $required) { throw "Archive is missing $required" }
            }
            if ($names | Where-Object { $_ -like "*.zvoice" }) { throw "Archive must not contain .zvoice files" }
            Write-Host "Archive contains all required entries ($($names.Count) total)."
          } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: dist/*.nvda-addon
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Publish a GitHub Release when building a version tag.
      # ---------------------------------------------------------------------
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          gh release create $version dist/*.nvda-addon `
            --title "Google TTS For NVDA $version" `
            --generate-notes
